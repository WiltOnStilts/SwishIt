# SQLite lives on /tmp at runtime (Render deploy FS is often read-only).
# ensure-db migrates + seeds only when the DB is empty.

services:
  - type: web
    name: swishit
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx tsx scripts/ensure-db.ts && npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/tmp/swishit.db
