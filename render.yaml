# Bundled SQLite seed is copied to /tmp on boot (Render FS is often read-only).
# Do NOT set NODE_ENV=production in the dashboard — it makes npm skip install tools.
# Existing Render services often ignore Blueprint YAML updates: paste buildCommand
# into Settings → Build & Deploy → Build Command, then Clear build cache & deploy.

services:
  - type: web
    name: swishit
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx next build
    startCommand: node -e "require('fs').copyFileSync('prisma/data/swishit.sqlite','/tmp/swishit.db')" && npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/tmp/swishit.db
