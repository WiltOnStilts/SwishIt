# Bundled SQLite seed is copied to /tmp on boot (Render FS is often read-only).

services:
  - type: web
    name: swishit
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node -e "require('fs').copyFileSync('prisma/data/swishit.sqlite','/tmp/swishit.db')" && npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/tmp/swishit.db
      - key: NODE_ENV
        value: production
