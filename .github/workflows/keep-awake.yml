name: Keep Render awake

on:
  schedule:
    # Free Render services spin down after 15 minutes. This stays inside that window.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app so Google sees the real robots.txt
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --max-time 90 \
            -A "SwishItKeepAlive" \
            "https://swishit.onrender.com/api/health"
