# Optional. SwishIt is on a paid Render plan (no sleep). Kept as light insurance
# only—safe to disable if GitHub Actions noise is unwanted.
name: Keep Render awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health, homepage, robots, and sitemap
        run: |
          set -euo pipefail
          BASE="https://swishit.onrender.com"
          for path in /api/health /robots.txt / /sitemap.xml; do
            curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 \
              -A "SwishItKeepAlive" \
              "$BASE$path" >/dev/null
          done
